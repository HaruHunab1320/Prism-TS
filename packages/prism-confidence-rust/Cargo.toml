[package]
name = "prism-confidence"
version = "0.1.0"
edition = "2021"
authors = ["Prism Language Contributors"]
description = "Rust implementation of the Prism confidence extraction library"
readme = "README.md"
repository = "https://github.com/HaruHunab1320/Prism-TS"
license = "MIT"
keywords = ["prism", "confidence", "uncertainty", "llm", "ai"]
categories = ["algorithms", "science", "text-processing"]

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "confidence_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
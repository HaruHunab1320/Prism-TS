project: argos-434718
zone: us-central1-f
machine_type: a2-highgpu-1g
preemptible: false
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-micro-js-map-control-004
    preflight_commands:
      - sudo apt-get update -y && sudo apt-get install -y nodejs npm
      - node --version
      - cd .. && python -m lumina_micro_specialists.data.build_js_array_loop_to_map_dataset --output-dir lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1 --train-size 320 --val-size 64 | tee lumina_multimodel/logs/lumina_micro_js_map_control_build_dataset.txt
      - test -f /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat/config.json
    commands:
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map --dataset lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1/val.jsonl --candidate-source model --model /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat --max-samples 64 --output-json lumina_multimodel/logs/lumina_micro_js_map_control_eval.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_control_eval.txt

  - name: lumina-micro-js-map-tx-004
    preflight_commands:
      - sudo apt-get update -y && sudo apt-get install -y nodejs npm
      - node --version
      - cd .. && python -m lumina_micro_specialists.data.build_js_array_loop_to_map_dataset --output-dir lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1 --train-size 320 --val-size 64 | tee lumina_multimodel/logs/lumina_micro_js_map_tx_build_dataset.txt
      - test -f /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat/config.json
    commands:
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.training.train_js_array_loop_to_map_adapter --data-root lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1 --model-name /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat --epochs 2 --batch-size 2 --lr 8e-6 --max-len 384 --max-train-samples 320 --max-val-samples 64 --unfreeze-n 2 --output-dir lumina_multimodel/outputs_gen --metrics-json lumina_multimodel/logs/lumina_micro_js_map_tx_train.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_tx_train.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map --dataset lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1/val.jsonl --candidate-source model --model lumina_multimodel/outputs_gen/js_array_loop_to_map__root_.cache_huggingface_flat_models_Qwen_Qwen2.5-Coder-1.5B-Instruct_flat_gen --max-samples 64 --output-json lumina_multimodel/logs/lumina_micro_js_map_tx_eval.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_tx_eval.txt

experiments:
  - name: lumina-micro-js-map-policy-stability-001
    preflight_commands:
      - sudo apt-get update -y && sudo apt-get install -y nodejs npm
      - node --version
      - cd .. && python -m py_compile lumina_micro_specialists/evaluation/eval_js_array_loop_to_map.py lumina_micro_specialists/evaluation/eval_js_array_loop_to_map_policy.py lumina_micro_specialists/evaluation/summarize_js_array_loop_to_map_policy_stability.py lumina_micro_specialists/training/train_js_array_loop_to_map_adapter.py lumina_micro_specialists/training/train_js_array_loop_to_map_confidence_head.py 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_stability_preflight.txt
      - test -f /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat/config.json
    commands:
      - mkdir -p logs outputs_gen
      - cd .. && python -m lumina_micro_specialists.data.build_js_array_loop_to_map_dataset --output-dir lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1 --train-size 320 --val-size 64 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_build_dataset.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.training.train_js_array_loop_to_map_adapter --data-root lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1 --model-name /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat --epochs 2 --batch-size 2 --lr 8e-6 --max-len 384 --max-train-samples 320 --max-val-samples 64 --unfreeze-n 2 --output-dir lumina_multimodel/outputs_gen --metrics-json lumina_multimodel/logs/lumina_micro_js_map_policy_tx_train.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_tx_train.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.training.train_js_array_loop_to_map_confidence_head --train-dataset lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1/train.jsonl --val-dataset lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1/val.jsonl --model lumina_multimodel/outputs_gen/js_array_loop_to_map__root_.cache_huggingface_flat_models_Qwen_Qwen2.5-Coder-1.5B-Instruct_flat_gen --max-train-samples 256 --max-val-samples 64 --output lumina_multimodel/outputs_gen/js_array_loop_to_map_confidence_probe.pt --metrics-json lumina_multimodel/logs/lumina_micro_js_map_policy_probe_train.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_probe_train.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map --dataset lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1/val.jsonl --candidate-source model --model lumina_multimodel/outputs_gen/js_array_loop_to_map__root_.cache_huggingface_flat_models_Qwen_Qwen2.5-Coder-1.5B-Instruct_flat_gen --confidence-head lumina_multimodel/outputs_gen/js_array_loop_to_map_confidence_probe.pt --max-samples 64 --seed 7 --output-json lumina_multimodel/logs/lumina_micro_js_map_eval_seed7.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_eval_seed7.txt
      - cd .. && python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map_policy --eval-json lumina_multimodel/logs/lumina_micro_js_map_eval_seed7.json --threshold 0.30 --output-json lumina_multimodel/logs/lumina_micro_js_map_policy_seed7_thr030.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_seed7_thr030.txt
      - cd .. && python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map_policy --eval-json lumina_multimodel/logs/lumina_micro_js_map_eval_seed7.json --threshold 0.50 --output-json lumina_multimodel/logs/lumina_micro_js_map_policy_seed7_thr050.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_seed7_thr050.txt

      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map --dataset lumina_micro_specialists/data/datasets/js_array_loop_to_map_v1/val.jsonl --candidate-source model --model lumina_multimodel/outputs_gen/js_array_loop_to_map__root_.cache_huggingface_flat_models_Qwen_Qwen2.5-Coder-1.5B-Instruct_flat_gen --confidence-head lumina_multimodel/outputs_gen/js_array_loop_to_map_confidence_probe.pt --max-samples 64 --seed 19 --output-json lumina_multimodel/logs/lumina_micro_js_map_eval_seed19.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_eval_seed19.txt
      - cd .. && python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map_policy --eval-json lumina_multimodel/logs/lumina_micro_js_map_eval_seed19.json --threshold 0.30 --output-json lumina_multimodel/logs/lumina_micro_js_map_policy_seed19_thr030.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_seed19_thr030.txt
      - cd .. && python -u -m lumina_micro_specialists.evaluation.eval_js_array_loop_to_map_policy --eval-json lumina_multimodel/logs/lumina_micro_js_map_eval_seed19.json --threshold 0.50 --output-json lumina_multimodel/logs/lumina_micro_js_map_policy_seed19_thr050.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_seed19_thr050.txt
      - cd .. && python -u -m lumina_micro_specialists.evaluation.summarize_js_array_loop_to_map_policy_stability lumina_multimodel/logs/lumina_micro_js_map_policy_seed7_thr030.json lumina_multimodel/logs/lumina_micro_js_map_policy_seed11_thr030.json lumina_multimodel/logs/lumina_micro_js_map_policy_seed19_thr030.json --output-json lumina_multimodel/logs/lumina_micro_js_map_policy_stability_thr030.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_map_policy_stability_thr030.txt

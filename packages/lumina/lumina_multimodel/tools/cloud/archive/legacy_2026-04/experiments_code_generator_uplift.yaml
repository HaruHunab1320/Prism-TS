project: argos-434718
zone: us-west1-b
machine_type: g2-standard-8
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-code-uplift-control-001
    commands:
      - mkdir -p outputs_gen_tx_general outputs_gen_tx_math outputs_gen_overfit outputs_router_fixed
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-math-uplift-tx-001/outputs_gen/ outputs_gen_tx_math/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-router-refresh-2000-002/outputs_router/ outputs_router_fixed/
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 2000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/code_uplift_control_debug_2000.jsonl --debug-limit 100000 2>&1 | tee logs/code_uplift_control_agg_2000.txt

  - name: lumina-code-uplift-tx-001
    commands:
      - python -u -m training.train_gpt2_generator --data-root datasets_hq_v2_curated --domain code --model-name Qwen/Qwen2.5-1.5B-Instruct --epochs 1 --batch-size 2 --lr 8e-6 --max-len 192 --answer-max-tokens 24 --max-train-samples 15710 --max-val-samples 995 --unfreeze-n 2 --output-dir outputs_gen 2>&1 | tee logs/code_uplift_treatment_train.txt
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_generator_qa --model-path outputs_gen/code_Qwen_Qwen2.5-1.5B-Instruct_gen --data-root datasets_hq_med --domain code --split val --max-samples 193 --max-new-tokens 24 | tee logs/code_uplift_treatment_qa_193.txt
      - mkdir -p outputs_gen_tx_general outputs_gen_tx_math outputs_gen_overfit outputs_router_fixed
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-math-uplift-tx-001/outputs_gen/ outputs_gen_tx_math/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-router-refresh-2000-002/outputs_router/ outputs_router_fixed/
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 2000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/code_uplift_treatment_debug_2000.jsonl --debug-limit 100000 2>&1 | tee logs/code_uplift_treatment_agg_2000.txt

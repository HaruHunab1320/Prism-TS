project: argos-434718
zone: us-east1-c
machine_type: g2-standard-8
preemptible: false
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-basic-math-confidence-002
    commands:
      - mkdir -p logs outputs_gen
      - echo 'lumina_basic math confidence start' | tee logs/lumina_basic_math_confidence_start.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_basic.training.train_math_confidence_head --model Qwen/Qwen2.5-Math-1.5B-Instruct --train-data lumina_multimodel/datasets_hq_v2_curated/math_specialist/train.jsonl --val-data lumina_multimodel/datasets_hq_v2_curated/math_specialist/val.jsonl --max-train-samples 1000 --max-val-samples 200 --max-new-tokens 24 --epochs 20 --batch-size 64 --lr 1e-3 --output lumina_multimodel/outputs_gen/lumina_basic_math_confidence_probe.pt --metrics-json lumina_multimodel/logs/lumina_basic_math_confidence_probe_train.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_math_confidence_probe_train.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_basic.evaluation.eval_math_confidence --model Qwen/Qwen2.5-Math-1.5B-Instruct --confidence-head lumina_multimodel/outputs_gen/lumina_basic_math_confidence_probe.pt --data-path lumina_multimodel/datasets_hq_v2_curated/math_specialist/val.jsonl --max-samples 500 --max-new-tokens 24 --answer-conf-threshold 0.50 --escalate-threshold 0.35 --output-json lumina_multimodel/logs/lumina_basic_math_confidence_eval.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_math_confidence_eval.txt

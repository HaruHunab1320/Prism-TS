project: argos-434718
zone: us-east1-c
machine_type: g2-standard-12
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-general-uplift-control-001
    commands:
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-ablate-a-clean-001/outputs_gen/ outputs_gen/
      - mkdir -p outputs_gen_overfit
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen/general_Qwen_Qwen2.5-0.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-0.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json 2>&1 | tee logs/general_uplift_control_agg_300.txt

  - name: lumina-general-uplift-tx-001
    commands:
      - python data/build_general_clean_slice.py --in-root datasets_hq_v2_curated --out-root datasets_general_uplift_treatment --max-train 20000 --max-val 1000 --min-words 1 --max-words 12
      - DATA_ROOT=datasets_general_uplift_treatment OUTPUT_DIR=outputs_gen MODEL_NAME=Qwen/Qwen2.5-1.5B-Instruct EPOCHS=1 BATCH_SIZE=2 MAX_LEN=192 UNFREEZE_N=2 MAX_TRAIN_SAMPLES=20000 MAX_VAL_SAMPLES=1000 LR=8e-6 ANSWER_MAX_TOKENS=10 DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 bash scripts/train_general_v2.sh
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_generator_qa --model-path outputs_gen/general_Qwen_Qwen2.5-1.5B-Instruct_gen --data-root datasets_hq_med --domain general --split val --max-samples 300 --max-new-tokens 24 --strict-answer --constrained-postprocess --max-answer-words 12 | tee logs/general_uplift_treatment_qa_300.txt
      - mkdir -p outputs_gen_overfit
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json 2>&1 | tee logs/general_uplift_treatment_agg_300.txt

project: argos-434718
zone: us-east1-c
machine_type: g2-standard-12
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-routing-isolation-001
    commands:
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-ablate-a-clean-001/outputs_gen/ outputs_gen/
      - mkdir -p outputs_gen_overfit
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - echo '=== router_only (alpha=1.0, conf_calibration.json) ===' | tee logs/routing_iso_router_only.txt
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen/general_Qwen_Qwen2.5-0.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-0.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration.json 2>&1 | tee -a logs/routing_iso_router_only.txt
      - echo '=== conf_only (alpha=0.0, conf_calibration.json) ===' | tee logs/routing_iso_conf_only.txt
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen/general_Qwen_Qwen2.5-0.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-0.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration.json 2>&1 | tee -a logs/routing_iso_conf_only.txt
      - echo '=== hybrid (alpha=0.5, conf_calibration.json) ===' | tee logs/routing_iso_hybrid_base_calib.txt
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen/general_Qwen_Qwen2.5-0.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-0.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration.json 2>&1 | tee -a logs/routing_iso_hybrid_base_calib.txt
      - echo '=== hybrid (alpha=0.5, conf_calibration_mixed_qwen.json) ===' | tee logs/routing_iso_hybrid_mixed_calib.txt
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen/general_Qwen_Qwen2.5-0.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-0.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json 2>&1 | tee -a logs/routing_iso_hybrid_mixed_calib.txt

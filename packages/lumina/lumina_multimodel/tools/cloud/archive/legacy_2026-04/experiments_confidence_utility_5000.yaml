project: argos-434718
zone: us-central1-a
machine_type: a2-highgpu-1g
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-confidence-utility-5000-001
    commands:
      - mkdir -p outputs_gen_tx_general outputs_gen_tx_math outputs_gen_tx_code outputs_router_fixed outputs_gpt2_recal logs
      - nvidia-smi | tee logs/conf_utility_nvidia_smi.txt
      - free -h | tee logs/conf_utility_free_h.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/ 2>&1 | tee logs/conf_utility_sync_general.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-math-uplift-robust-tx-5000-002/outputs_gen/ outputs_gen_tx_math/ 2>&1 | tee logs/conf_utility_sync_math.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-code-uplift-tx-001/outputs_gen/ outputs_gen_tx_code/ 2>&1 | tee logs/conf_utility_sync_code.txt
      - python -u scripts/build_router_dataset.py --data-root datasets_hq_med --max-train-per-domain 30000 --max-val-per-domain 3000 | tee logs/conf_utility_build_router.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m training.train_router --data-root datasets_hq_med --epochs 8 --batch-size 64 --max-len 128 --hidden-size 256 --dropout 0.1 --lr 3e-4 --output-dir outputs_router_fixed 2>&1 | tee logs/conf_utility_train_router.txt
      - echo '=== router only baseline ===' > logs/conf_utility_router_only_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/conf_utility_router_only_debug_5000.jsonl --debug-limit 100000 >> logs/conf_utility_router_only_5000.txt 2>&1
      - echo '=== hybrid current confidence ===' > logs/conf_utility_hybrid_current_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/conf_utility_hybrid_current_debug_5000.jsonl --debug-limit 100000 >> logs/conf_utility_hybrid_current_5000.txt 2>&1
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m training.train_gpt2_confidence --data-root datasets_hq_med --domain general --epochs 2 --batch-size 8 --max-train-samples 30000 --max-val-samples 3000 --freeze-base --output outputs_gpt2_recal 2>&1 | tee logs/conf_utility_train_general_conf.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m training.train_gpt2_confidence --data-root datasets_hq_med --domain math --epochs 2 --batch-size 8 --max-train-samples 11164 --max-val-samples 1319 --freeze-base --output outputs_gpt2_recal 2>&1 | tee logs/conf_utility_train_math_conf.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m training.train_gpt2_confidence --data-root datasets_hq_med --domain code --epochs 2 --batch-size 8 --max-train-samples 15710 --max-val-samples 193 --freeze-base --output outputs_gpt2_recal 2>&1 | tee logs/conf_utility_train_code_conf.txt
      - DATA_ROOT=datasets_hq_med OUTPUTS_GPT2_DIR=outputs_gpt2_recal MAX_SAMPLES=5000 OUT_PATH=outputs_gpt2_recal/conf_calibration_hq_med_recal.json bash tools/build_conf_calibration_hq_med.sh | tee logs/conf_utility_build_calibration.txt
      - echo '=== hybrid recalibrated confidence ===' > logs/conf_utility_hybrid_recal_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2_recal/general_gpt2_confidence.pt outputs_gpt2_recal/math_gpt2_confidence.pt outputs_gpt2_recal/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2_recal/conf_calibration_hq_med_recal.json --debug-dump logs/conf_utility_hybrid_recal_debug_5000.jsonl --debug-limit 100000 >> logs/conf_utility_hybrid_recal_5000.txt 2>&1

project: argos-434718
zone: us-central1-f
machine_type: a2-highgpu-1g
preemptible: false
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-9-cu129-ubuntu-2204-nvidia-580
image_project: deeplearning-platform-release

experiments:
  - name: lumina-micro-js-reduce-index-hard-gate-001
    preflight_commands:
      - for i in $(seq 1 30); do sudo apt-get update -y && sudo apt-get install -y nodejs npm && exit 0; echo "apt lock busy, retrying in 10s"; sleep 10; done; exit 1
      - node --version
      - cd .. && python -m py_compile lumina_micro_specialists/data/build_js_reduce_object_index_builder_dataset.py lumina_micro_specialists/runtime/router_js_reduce_object_index_builder.py lumina_micro_specialists/evaluation/verify_js_reduce_object_index_builder.py lumina_micro_specialists/evaluation/eval_js_reduce_object_index_builder.py lumina_micro_specialists/training/train_js_reduce_object_index_builder_adapter.py 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_reduce_index_hard_preflight.txt
      - test -f /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat/config.json
    commands:
      - cd .. && python -m lumina_micro_specialists.data.build_js_reduce_object_index_builder_dataset --output-dir lumina_micro_specialists/data/datasets/js_reduce_object_index_builder_v1 --train-size 320 --val-size 64 --hard-val-size 128 | tee lumina_multimodel/logs/lumina_micro_js_reduce_index_hard_build_dataset.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.training.train_js_reduce_object_index_builder_adapter --data-root lumina_micro_specialists/data/datasets/js_reduce_object_index_builder_v1 --model-name /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat --epochs 2 --batch-size 2 --lr 8e-6 --max-len 384 --max-train-samples 320 --max-val-samples 64 --unfreeze-n 2 --output-dir lumina_multimodel/outputs_gen --metrics-json lumina_multimodel/logs/lumina_micro_js_reduce_index_hard_tx_train.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_reduce_index_hard_tx_train.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_reduce_object_index_builder --dataset lumina_micro_specialists/data/datasets/js_reduce_object_index_builder_v1/hard_val.jsonl --candidate-source model --model lumina_multimodel/outputs_gen/js_reduce_object_index_builder__root_.cache_huggingface_flat_models_Qwen_Qwen2.5-Coder-1.5B-Instruct_flat_gen --max-samples 128 --max-new-tokens 128 --output-json lumina_multimodel/logs/lumina_micro_js_reduce_index_hard_eval.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_reduce_index_hard_eval.txt

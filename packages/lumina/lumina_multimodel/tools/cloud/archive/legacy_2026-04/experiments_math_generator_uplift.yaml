project: argos-434718
zone: us-east1-c
machine_type: g2-standard-12
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-math-uplift-control-001
    commands:
      - mkdir -p outputs_gen_tx_general
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/
      - mkdir -p outputs_gen_overfit
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_overfit/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json 2>&1 | tee logs/math_uplift_control_agg_300.txt

  - name: lumina-math-uplift-tx-001
    commands:
      - python -u -m training.train_gpt2_generator --data-root datasets_hq_v2_curated --domain math --model-name Qwen/Qwen2.5-Math-1.5B-Instruct --epochs 1 --batch-size 2 --lr 8e-6 --max-len 192 --answer-max-tokens 8 --max-train-samples 10000 --max-val-samples 500 --unfreeze-n 2 --output-dir outputs_gen --strict-answer --math-canonical-targets
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_generator_qa --model-path outputs_gen/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen --data-root datasets_hq_med --domain math --split val --max-samples 300 --max-new-tokens 24 --strict-answer --constrained-postprocess --max-answer-words 8 --math-canonical-metric | tee logs/math_uplift_treatment_qa_300.txt
      - mkdir -p outputs_gen_tx_general
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/
      - mkdir -p outputs_gen_overfit
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/outputs_gen_overfit/ outputs_gen_overfit/
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_overfit/code_Qwen_Qwen2.5-0.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router/router.pt --router-labels outputs_router/labels.json --max-samples 300 --max-new-tokens 24 --alpha 0.5 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json 2>&1 | tee logs/math_uplift_treatment_agg_300.txt

project: argos-434718
zone: us-east1-c
machine_type: g2-standard-8
preemptible: false
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-code-exec-benchmark-001
    commands:
      - mkdir -p outputs_gen_base outputs_gen_exec benchmarks/code_exec logs
      - echo 'code exec benchmark eval start' | tee logs/code_exec_benchmark_start.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-code-uplift-tx-001/outputs_gen/ outputs_gen_base/ 2>&1 | tee logs/code_exec_benchmark_sync_base.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-code-exec-tx-5000-001/outputs_gen/ outputs_gen_exec/ 2>&1 | tee logs/code_exec_benchmark_sync_exec.txt
      - set -o pipefail; TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u data/export_code_exec_fixtures.py --out-root benchmarks/code_exec 2>&1 | tee logs/code_exec_benchmark_export_fixtures.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_code_exec --model-path outputs_gen_base/code_Qwen_Qwen2.5-1.5B-Instruct_gen --fixture-root benchmarks/code_exec --benchmark both --max-samples 100 --max-new-tokens 128 --timeout-sec 4.0 2>&1 | tee logs/code_exec_benchmark_base.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_code_exec --model-path outputs_gen_exec/code_Qwen_Qwen2.5-Coder-1.5B-Instruct_gen --fixture-root benchmarks/code_exec --benchmark both --max-samples 100 --max-new-tokens 128 --timeout-sec 4.0 2>&1 | tee logs/code_exec_benchmark_exec_v1.txt

project: argos-434718
zone: us-central1-f
machine_type: a2-highgpu-1g
preemptible: false
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-micro-js-reduce-baseline-001
    preflight_commands:
      - sudo apt-get update -y && sudo apt-get install -y nodejs npm
      - node --version
      - cd .. && python -m py_compile lumina_micro_specialists/data/build_js_reduce_accumulator_refactor_dataset.py lumina_micro_specialists/runtime/router_js_reduce_accumulator_refactor.py lumina_micro_specialists/evaluation/verify_js_reduce_accumulator_refactor.py lumina_micro_specialists/evaluation/eval_js_reduce_accumulator_refactor.py 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_reduce_preflight.txt
      - test -f /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat/config.json
    commands:
      - cd .. && python -m lumina_micro_specialists.data.build_js_reduce_accumulator_refactor_dataset --output-dir lumina_micro_specialists/data/datasets/js_reduce_accumulator_refactor_v1 --train-size 320 --val-size 64 | tee lumina_multimodel/logs/lumina_micro_js_reduce_build_dataset.txt
      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_reduce_accumulator_refactor --dataset lumina_micro_specialists/data/datasets/js_reduce_accumulator_refactor_v1/val.jsonl --candidate-source model --model /root/.cache/huggingface/flat_models/Qwen_Qwen2.5-Coder-1.5B-Instruct_flat --max-samples 64 --output-json lumina_multimodel/logs/lumina_micro_js_reduce_baseline_eval.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_reduce_baseline_eval.txt

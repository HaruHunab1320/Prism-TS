project: argos-434718
zone: us-central1-a
machine_type: a2-highgpu-1g
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-disagreement-utility-5000-001
    commands:
      - mkdir -p outputs_gen_tx_general outputs_gen_tx_math outputs_gen_tx_code outputs_router_fixed logs
      - nvidia-smi | tee logs/disagreement_utility_nvidia_smi.txt
      - free -h | tee logs/disagreement_utility_free_h.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/ 2>&1 | tee logs/disagreement_utility_sync_general.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-math-uplift-robust-tx-5000-002/outputs_gen/ outputs_gen_tx_math/ 2>&1 | tee logs/disagreement_utility_sync_math.txt
      - set -o pipefail; gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-code-uplift-tx-001/outputs_gen/ outputs_gen_tx_code/ 2>&1 | tee logs/disagreement_utility_sync_code.txt
      - python -u scripts/build_router_dataset.py --data-root datasets_hq_med --max-train-per-domain 30000 --max-val-per-domain 3000 | tee logs/disagreement_utility_build_router.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m training.train_router --data-root datasets_hq_med --epochs 8 --batch-size 64 --max-len 128 --hidden-size 256 --dropout 0.1 --lr 3e-4 --output-dir outputs_router_fixed 2>&1 | tee logs/disagreement_utility_train_router.txt
      - echo '=== direct answer baseline ===' > logs/disagreement_utility_baseline_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 1 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/disagreement_utility_baseline_debug_5000.jsonl --debug-limit 100000 >> logs/disagreement_utility_baseline_5000.txt 2>&1
      - echo '=== top2 current aggregation ===' > logs/disagreement_utility_current_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/disagreement_utility_current_debug_5000.jsonl --debug-limit 100000 >> logs/disagreement_utility_current_5000.txt 2>&1
      - echo '=== top2 oracle diagnostic ===' > logs/disagreement_utility_oracle_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_fixed/router.pt --router-labels outputs_router_fixed/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --oracle-mode --debug-dump logs/disagreement_utility_oracle_debug_5000.jsonl --debug-limit 100000 >> logs/disagreement_utility_oracle_5000.txt 2>&1
      - python -u scripts/analyze_disagreement_utility.py --baseline-debug logs/disagreement_utility_baseline_debug_5000.jsonl --current-debug logs/disagreement_utility_current_debug_5000.jsonl --oracle-debug logs/disagreement_utility_oracle_debug_5000.jsonl --min-ans-conf 0.40 --max-overlap 0.30 | tee logs/disagreement_utility_analysis_5000.txt

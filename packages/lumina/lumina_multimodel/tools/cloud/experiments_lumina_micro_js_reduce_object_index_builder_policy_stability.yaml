      - cd .. && set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=1 HF_DATASETS_OFFLINE=1 python -u -m lumina_micro_specialists.evaluation.eval_js_reduce_object_index_builder --dataset lumina_micro_specialists/data/datasets/js_reduce_object_index_builder_v1/hard_val_v2.jsonl --candidate-source model --model lumina_multimodel/outputs_gen/js_reduce_object_index_builder__root_.cache_huggingface_flat_models_Qwen_Qwen2.5-Coder-1.5B-Instruct_flat_gen --confidence-head lumina_multimodel/outputs_gen/js_reduce_object_index_builder_confidence_probe.pt --max-samples 128 --max-new-tokens 128 --seed 19 --output-json lumina_multimodel/logs/lumina_micro_js_reduce_index_eval_seed19.json 2>&1 | tee lumina_multimodel/logs/lumina_micro_js_reduce_index_eval_seed19.txt

project: argos-434718
zone: us-east1-c
machine_type: g2-standard-8
preemptible: false
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-basic-qwen-math-probe-v2-stability-001
    preflight_commands:
      - set -o pipefail; cd .. && python -u -m lumina_basic.evaluation.preflight_math_confidence 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_preflight.txt
    commands:
      - mkdir -p logs outputs_gen
      - echo 'lumina_basic qwen math probe v2 stability start' | tee logs/lumina_basic_qwen_math_probe_v2_stability_start.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_multimodel.training.train_gpt2_generator --data-root lumina_multimodel/datasets_hq_v2_curated --domain math --model-name Qwen/Qwen2.5-Math-1.5B-Instruct --epochs 2 --batch-size 2 --lr 8e-6 --max-len 256 --answer-max-tokens 16 --max-train-samples 10433 --max-val-samples 549 --unfreeze-n 2 --output-dir lumina_multimodel/outputs_gen --strict-answer 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_finetune.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_basic.training.train_math_confidence_head --model lumina_multimodel/outputs_gen/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen --train-data lumina_multimodel/datasets_hq_v2_curated/math_specialist/train.jsonl --val-data lumina_multimodel/datasets_hq_v2_curated/math_specialist/val.jsonl --max-train-samples 4000 --max-val-samples 500 --max-new-tokens 24 --epochs 20 --batch-size 64 --lr 1e-3 --math-contract-features --output lumina_multimodel/outputs_gen/lumina_basic_qwen_math_probe_v2_stability.pt --metrics-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_train.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_train.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_basic.evaluation.eval_math_confidence --model lumina_multimodel/outputs_gen/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen --confidence-head lumina_multimodel/outputs_gen/lumina_basic_qwen_math_probe_v2_stability.pt --data-path lumina_multimodel/datasets_hq_v2_curated/math_specialist/val.jsonl --max-samples 500 --seed 7 --max-new-tokens 24 --math-contract-features --answer-conf-threshold 0.20 --escalate-threshold 0.35 --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed7.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed7.txt
      - set -o pipefail; cd .. && python -u -m lumina_basic.evaluation.eval_math_confidence_policy --eval-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed7.json --mode escalation --threshold 0.20 --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed7_thr020_escalation.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed7_thr020_escalation.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_basic.evaluation.eval_math_confidence --model lumina_multimodel/outputs_gen/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen --confidence-head lumina_multimodel/outputs_gen/lumina_basic_qwen_math_probe_v2_stability.pt --data-path lumina_multimodel/datasets_hq_v2_curated/math_specialist/val.jsonl --max-samples 500 --seed 11 --max-new-tokens 24 --math-contract-features --answer-conf-threshold 0.20 --escalate-threshold 0.35 --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed11.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed11.txt
      - set -o pipefail; cd .. && python -u -m lumina_basic.evaluation.eval_math_confidence_policy --eval-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed11.json --mode escalation --threshold 0.20 --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed11_thr020_escalation.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed11_thr020_escalation.txt
      - set -o pipefail; cd .. && DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m lumina_basic.evaluation.eval_math_confidence --model lumina_multimodel/outputs_gen/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen --confidence-head lumina_multimodel/outputs_gen/lumina_basic_qwen_math_probe_v2_stability.pt --data-path lumina_multimodel/datasets_hq_v2_curated/math_specialist/val.jsonl --max-samples 500 --seed 19 --max-new-tokens 24 --math-contract-features --answer-conf-threshold 0.20 --escalate-threshold 0.35 --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed19.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed19.txt
      - set -o pipefail; cd .. && python -u -m lumina_basic.evaluation.eval_math_confidence_policy --eval-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_eval_seed19.json --mode escalation --threshold 0.20 --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed19_thr020_escalation.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed19_thr020_escalation.txt
      - set -o pipefail; cd .. && python -u -m lumina_basic.evaluation.summarize_math_confidence_policy_stability lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed7_thr020_escalation.json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed11_thr020_escalation.json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_seed19_thr020_escalation.json --output-json lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_thr020_escalation_summary.json 2>&1 | tee lumina_multimodel/logs/lumina_basic_qwen_math_probe_v2_stability_thr020_escalation_summary.txt

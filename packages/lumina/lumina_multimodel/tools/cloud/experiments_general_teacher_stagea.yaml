experiments:
  - name: lumina-general-teacher-001
    commands:
      - IN_ROOT=datasets_hq_v2_curated OUT_ROOT=datasets_general_clean_v2_teacher MAX_TRAIN=40000 MAX_VAL=1000 MIN_WORDS=1 MAX_WORDS=12 TEACHER_MODEL=Qwen/Qwen2.5-3B-Instruct TEACHER_DEVICE=cuda TEACHER_LIMIT_TRAIN=20000 TEACHER_LIMIT_VAL=1000 bash tools/build_general_clean_slice_v2.sh
      - DATA_ROOT=datasets_general_clean_v2_teacher OUTPUT_DIR=outputs_gen_overfit_v4 MODEL_NAME=Qwen/Qwen2.5-0.5B-Instruct EPOCHS=2 UNFREEZE_N=4 MAX_TRAIN_SAMPLES=20000 MAX_VAL_SAMPLES=1000 LR=1e-5 ANSWER_MAX_TOKENS=10 DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 bash scripts/train_general_v2.sh
      - DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_generator_qa --model-path outputs_gen_overfit_v4/general_Qwen_Qwen2.5-0.5B-Instruct_gen --data-root datasets_general_clean_v2_teacher --domain general --split val --max-samples 300 --max-new-tokens 24 --strict-answer --constrained-postprocess --max-answer-words 12 | tee logs/general_v4_qa_300.txt

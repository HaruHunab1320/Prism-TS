project: argos-434718
zone: us-east1-c
machine_type: g2-standard-8
preemptible: true
bucket: gs://lumina-checkpoints-argos-2026
repo_url: https://github.com/HaruHunab1320/Prism-TS.git
image_family: pytorch-2-7-cu128-ubuntu-2204-nvidia-570
image_project: deeplearning-platform-release

experiments:
  - name: lumina-router-robustness-5000-001
    commands:
      - mkdir -p outputs_gen_tx_general outputs_gen_tx_math outputs_gen_tx_code logs
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-general-uplift-tx-001/outputs_gen/ outputs_gen_tx_general/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-math-uplift-tx-001/outputs_gen/ outputs_gen_tx_math/
      - gsutil -m rsync -r gs://lumina-checkpoints-argos-2026/runs/lumina-code-uplift-tx-001/outputs_gen/ outputs_gen_tx_code/
      - python -u scripts/build_router_dataset.py --data-root datasets_hq_med --max-train-per-domain 30000 --max-val-per-domain 3000 | tee logs/router_robustness_build_dataset_5000.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m training.train_router --data-root datasets_hq_med --epochs 8 --batch-size 64 --max-len 128 --hidden-size 256 --dropout 0.1 --lr 3e-4 --output-dir outputs_router_robust 2>&1 | tee logs/router_robustness_train_5000.txt
      - echo '=== router robustness seed 7 ===' | tee logs/router_robustness_eval_seed7.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_robust/router.pt --router-labels outputs_router_robust/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 7 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/router_robustness_debug_seed7.jsonl --debug-limit 100000 2>&1 | tee -a logs/router_robustness_eval_seed7.txt
      - python -c "import json,collections; p='logs/router_robustness_debug_seed7.jsonl'; rows=[json.loads(x) for x in open(p) if x.strip()]; rt=collections.Counter(r['routed_domain'] for r in rows); td=collections.Counter(r['true_domain'] for r in rows); pair=collections.Counter((r['true_domain'],r['routed_domain']) for r in rows); print('debug_rows=',len(rows)); print('routed=',dict(rt)); print('true=',dict(td)); print('true_to_routed=',dict(pair))" | tee logs/router_robustness_routes_seed7.txt
      - echo '=== router robustness seed 11 ===' | tee logs/router_robustness_eval_seed11.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_robust/router.pt --router-labels outputs_router_robust/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 11 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/router_robustness_debug_seed11.jsonl --debug-limit 100000 2>&1 | tee -a logs/router_robustness_eval_seed11.txt
      - python -c "import json,collections; p='logs/router_robustness_debug_seed11.jsonl'; rows=[json.loads(x) for x in open(p) if x.strip()]; rt=collections.Counter(r['routed_domain'] for r in rows); td=collections.Counter(r['true_domain'] for r in rows); pair=collections.Counter((r['true_domain'],r['routed_domain']) for r in rows); print('debug_rows=',len(rows)); print('routed=',dict(rt)); print('true=',dict(td)); print('true_to_routed=',dict(pair))" | tee logs/router_robustness_routes_seed11.txt
      - echo '=== router robustness seed 19 ===' | tee logs/router_robustness_eval_seed19.txt
      - set -o pipefail; DEVICE=cuda TRANSFORMERS_OFFLINE=0 HF_DATASETS_OFFLINE=0 python -u -m evaluation.eval_aggregator_minimal --data-root datasets_hq_med --domains general math code --weights outputs_gpt2/general_gpt2_confidence.pt outputs_gpt2/math_gpt2_confidence.pt outputs_gpt2/code_gpt2_confidence.pt --generator-domain-weights outputs_gen_tx_general/general_Qwen_Qwen2.5-1.5B-Instruct_gen outputs_gen_tx_math/math_Qwen_Qwen2.5-Math-1.5B-Instruct_gen outputs_gen_tx_code/code_Qwen_Qwen2.5-1.5B-Instruct_gen --generator-model Qwen/Qwen2.5-1.5B-Instruct --router-weights outputs_router_robust/router.pt --router-labels outputs_router_robust/labels.json --max-samples 5000 --max-new-tokens 24 --alpha 1.0 --top-k 2 --abstain-threshold 0.55 --conflict-margin 0.05 --seed 19 --conf-calibration outputs_gpt2/conf_calibration_mixed_qwen.json --debug-dump logs/router_robustness_debug_seed19.jsonl --debug-limit 100000 2>&1 | tee -a logs/router_robustness_eval_seed19.txt
      - python -c "import json,collections; p='logs/router_robustness_debug_seed19.jsonl'; rows=[json.loads(x) for x in open(p) if x.strip()]; rt=collections.Counter(r['routed_domain'] for r in rows); td=collections.Counter(r['true_domain'] for r in rows); pair=collections.Counter((r['true_domain'],r['routed_domain']) for r in rows); print('debug_rows=',len(rows)); print('routed=',dict(rt)); print('true=',dict(td)); print('true_to_routed=',dict(pair))" | tee logs/router_robustness_routes_seed19.txt

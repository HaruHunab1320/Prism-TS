experimentation_loop:
  id: "experimentation_loop"
  title: "Experimentation Orchestration"
  description: "Meta-orchestration agents compose primitives to explore hypotheses with telemetry feedback."
  structuredSpec:
    goal: "Generate, evaluate, and deploy experiments using primitive-based orchestration."
    inputs:
      -
        name: "hypothesis"
        type: "string"
        description: "Experiment hypothesis or objective."
      -
        name: "metrics"
        type: "list"
        description: "Success metrics to monitor."
    signals:
      -
        name: "pattern_generator"
        source: "@parallax/pattern-sdk"
        confidence: ">=0.8 indicates viable pattern composition"
      -
        name: "telemetry_feedback"
        source: "telemetry"
        confidence: ">=0.75 indicates trustworthy metrics"
    decisionPoints:
      -
        name: "pattern_selection"
        condition: "generator.compose(...)"
        pass: "register + execute pattern"
        fail: "fallback to manual design"
      -
        name: "go_no_go"
        logic: "uncertain if (~telemetry_feedback)"
        outcomes:
          high: "promote experiment"
          medium: "run additional cycles"
          low: "sunset experiment"
    escalationPaths:
      -
        trigger: "low confidence telemetry or high risk"
        destination: "product_council"
        actions:
          - "share metrics"
          - "recommend pivot"
    outputs:
      -
        name: "experiment_catalog"
        description: "Registered patterns, metrics, promotion decisions."
  nlArtifacts:
    tickets:
      -
        subject: "New onboarding experiment proposal"
        body: "Product wants to test a guided onboarding flow. Need the experimentation orchestrator to generate a pattern, monitor metrics, and recommend promote/pivot/sunset."
      -
        subject: "Experiment sunset review"
        body: "Conversion dropped 2%. Run the experimentation loop to decide if we pivot, collect more data, or sunset entirely."
    dialogues:
      -
        -
          speaker: "Product Lead"
          text: "Our hypothesis is conversion improves 10%. Can we automate the experiment lifecycle?"
        -
          speaker: "Meta-Agent"
          text: "I’ll compose a pattern from primitives and watch telemetry for promotion confidence."
        -
          speaker: "Data Scientist"
          text: "Please log metrics per cohort so we can validate uplift."
      -
        -
          speaker: "Product Lead"
          text: "Telemetry shows mixed results. Promote or keep iterating?"
        -
          speaker: "Meta-Agent"
          text: "Confidence is 0.64; we need another cycle."
        -
          speaker: "Growth PM"
          text: "Alright, run another loop and send me the catalog."
  references:
    -
      source: "docs/META_ORCHESTRATION.md"
